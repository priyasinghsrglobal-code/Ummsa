name: Verify existing SR Telegram bot + Ummsa signals
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q bot.py chart.py features.py engine.py directional_signal.py web_engine.py supply_signal.py telegram_signals.py
      - run: python -m unittest discover -p 'test*.py' -v
